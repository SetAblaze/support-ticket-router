[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-router"
version = "3.1.2"
description = "Маршрутизация обращений в поддержку интернет-магазина: тема, очередь, приоритет и риски"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn==1.8.0",  # модель загружается только при той же версии, что при обучении
    "joblib>=1.4",
    "threadpoolctl>=3.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "prometheus-client>=0.20"]
demo = ["gradio==6.0.0"]
semantic = ["onnxruntime==1.23.2", "tokenizers==0.22.1"]
notebook = ["matplotlib>=3.9", "seaborn>=0.13", "wordcloud>=1.9", "nbformat>=5.10", "nbclient>=0.10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
support-router-train = "support_router.train:main"
support-router-api = "support_router.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# Предупреждения сторонних библиотек (starlette, matplotlib) о будущих изменениях их API, к проекту не относятся.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:.*deprecated - use:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Код этапов 1-9 перенесён дословно: его плотный стиль (несколько операторов
# в строке, короткие имена) не трогаем, чтобы не менять поведение при переносе.
ignore = ["E401", "E402", "E701", "E702", "E731", "E741", "E501"]
