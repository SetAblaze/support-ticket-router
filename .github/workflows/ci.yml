name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install fast dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest==8.4.2 httpx==0.28.1 ruff==0.17.5
      - name: Ruff
        run: ruff check src scripts tests
      - name: Pytest
        run: python -m pytest -q

  data-and-release:
    name: Data and release invariants
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest==8.4.2 httpx==0.28.1
      - name: Verify the processed split is reproducible
        run: python scripts/prepare_data.py --verify
      - name: Verify the release manifest
        run: python scripts/release_manifest.py --verify

  full-ml:
    name: Full ML diagnostics (optional)
    runs-on: ubuntu-latest
    needs: fast
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify data and release identity
        run: |
          python scripts/prepare_data.py --verify
          python scripts/release_manifest.py --verify
      - name: Run full test suite
        run: python -m pytest -q
