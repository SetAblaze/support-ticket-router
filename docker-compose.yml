# Сервис и Prometheus одной командой: docker compose up --build
# API:        http://localhost:8000/docs
# Prometheus: http://localhost:9090  (вкладка Alerts показывает правила из monitoring/alert_rules.yml)
services:
  api:
    build: .
    image: support-router:3.1.1
    ports:
      - "8000:8000"
    environment:
      ROUTER_LOG_LEVEL: INFO
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped
